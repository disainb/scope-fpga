name: lint-and-sim

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install cocotb

      - name: Lint
        run: make lint

      - name: Simulate
        run: make sim

      - name: Yosys resource check
        run: make synth-check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-results
          path: sim/results.xml
